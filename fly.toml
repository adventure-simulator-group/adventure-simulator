# fly.toml app configuration file generated for adventure-simulator-web on 2026-02-03T15:51:33+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'adventure-simulator-web'
primary_region = 'ord'

[build]
  dockerfile = 'crates/strategic-web/Dockerfile'

[env]
  BIND_ADDRESS = '0.0.0.0:8080'
  SPACETIMEDB_DATABASE = 'strategic-db'
  SPACETIMEDB_HOST = 'https://maincloud.spacetimedb.com'
  STATIC_DIR = '/static'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
