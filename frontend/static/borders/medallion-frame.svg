<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gold-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b86e"/>
      <stop offset="30%" stop-color="#c4a44e"/>
      <stop offset="70%" stop-color="#b8963e"/>
      <stop offset="100%" stop-color="#8a7030"/>
    </linearGradient>
    <linearGradient id="dark-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a4d3a"/>
      <stop offset="100%" stop-color="#3d3425"/>
    </linearGradient>
    <linearGradient id="highlight-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fff8e6" stop-opacity="0"/>
    </linearGradient>

    <!-- Clip path for inner content -->
    <clipPath id="inner-circle">
      <circle cx="50" cy="50" r="38"/>
    </clipPath>
  </defs>

  <!-- Outer dark ring -->
  <circle cx="50" cy="50" r="48" fill="url(#dark-m)"/>

  <!-- Main gold ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#gold-m)" stroke-width="8"/>

  <!-- Inner dark band -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#dark-m)" stroke-width="2"/>

  <!-- Inner gold accent -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#gold-m)" stroke-width="1"/>

  <!-- Decorative notches around the frame (like a coin) -->
  <g stroke="url(#gold-m)" stroke-width="1">
    <!-- Top -->
    <line x1="50" y1="2" x2="50" y2="6"/>
    <!-- Right -->
    <line x1="98" y1="50" x2="94" y2="50"/>
    <!-- Bottom -->
    <line x1="50" y1="98" x2="50" y2="94"/>
    <!-- Left -->
    <line x1="2" y1="50" x2="6" y2="50"/>

    <!-- Diagonals -->
    <line x1="85" y1="15" x2="82" y2="18" transform="rotate(0 50 50)"/>
    <line x1="85" y1="85" x2="82" y2="82" transform="rotate(0 50 50)"/>
    <line x1="15" y1="85" x2="18" y2="82" transform="rotate(0 50 50)"/>
    <line x1="15" y1="15" x2="18" y2="18" transform="rotate(0 50 50)"/>
  </g>

  <!-- Small decorative dots -->
  <circle cx="50" cy="8" r="2" fill="url(#gold-m)"/>
  <circle cx="92" cy="50" r="2" fill="url(#gold-m)"/>
  <circle cx="50" cy="92" r="2" fill="url(#gold-m)"/>
  <circle cx="8" cy="50" r="2" fill="url(#gold-m)"/>

  <!-- Corner flourishes (simplified acanthus) -->
  <g fill="url(#gold-m)" opacity="0.9">
    <!-- Top-right -->
    <path d="M75 12 Q82 15 85 25 Q80 22 75 12" transform="rotate(45 50 50)"/>
    <!-- Bottom-right -->
    <path d="M75 12 Q82 15 85 25 Q80 22 75 12" transform="rotate(135 50 50)"/>
    <!-- Bottom-left -->
    <path d="M75 12 Q82 15 85 25 Q80 22 75 12" transform="rotate(225 50 50)"/>
    <!-- Top-left -->
    <path d="M75 12 Q82 15 85 25 Q80 22 75 12" transform="rotate(315 50 50)"/>
  </g>

  <!-- Highlight arc (makes it look 3D) -->
  <path d="M20 30 A35 35 0 0 1 70 15" stroke="url(#highlight-m)" stroke-width="3" fill="none"/>

  <!-- Shadow arc -->
  <path d="M80 70 A35 35 0 0 1 30 85" stroke="url(#dark-m)" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
