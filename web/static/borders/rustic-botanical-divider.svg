    <circle cx="80" cy="30" r="4" fill="#75433D"/>
    <circle cx="120" cy="24" r="3" fill="#E2CDC6"/>
    <circle cx="120" cy="36" r="3" fill="#E2CDC6"/>
    <circle cx="320" cy="30" r="4" fill="#75433D"/>
    <circle cx="280" cy="24" r="3" fill="#E2CDC6"/>
    <circle cx="280" cy="36" r="3" fill="#E2CDC6"/>

    <!-- End caps with botanical feel -->
    <circle cx="15" cy="30" r="10" fill="#855956"/>
    <circle cx="15" cy="30" r="6" fill="#E9D899"/>
    <circle cx="15" cy="30" r="3" fill="#75433D"/>
    <circle cx="385" cy="30" r="10" fill="#855956"/>
    <circle cx="385" cy="30" r="6" fill="#E9D899"/>
    <circle cx="385" cy="30" r="3" fill="#75433D"/>
