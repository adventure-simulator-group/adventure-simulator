[workspace]
resolver = "3"
members = [
  "crates/adventuresim-puzzles",
  "crates/adventuresim-dialogue",
  "crates/adventuresim-core",
  "crates/adventuresim-strategic-sim",
  "crates/adventuresim-world-schema",
  "crates/adventuresim-world-import",
  "crates/adventuresim-terrain",
  "crates/adventuresim-weapon-model",
  "crates/adventuresim-building-generator",
  "crates/adventuresim-stdb-module",
  "crates/adventuresim-stdb-client",
  "crates/adventuresim-tactical-core",
  "crates/adventuresim-tactical-netcode",
  "crates/adventuresim-tactical-client",
  "crates/adventuresim-tactical-server",
  "crates/adventuresim-tactical-server-dispatcher",
  "crates/adventuresim-tactical-brp-generator",
  "crates/strategic-web",
  "crates/fabelgeist-math",
  "crates/fabelgeist-animation",
  "crates/fabelgeist-determinism",
  "crates/fabelgeist-timer",
  "crates/fabelgeist-fs",
  "crates/fabelgeist-gpu",
  "crates/fabelgeist-fbx",
  "crates/fabelgeist-rust-quality",
]
exclude = [
  "wiki",
  "utils",
  "crates/adventuresim-character-creator",
  # Everything that pulls burn keeps its own workspace: the git
  # dependency and its cubecl toolchain do not belong in the everyday build.
  "crates/fabelgeist-mhr",
  "crates/fabelgeist-numpy-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/adventure-simulator-group/fabelgeist"
license = "GPL-3.0"

[workspace.dependencies]
adventuresim-tactical-netcode = { version = "0.1.0", default-features = false }
adventuresim-tactical-core = { version = "0.1.0" }
adventuresim-stdb-client = { version = "0.1.0" }
adventuresim-core = { version = "0.1.0" }
adventuresim-puzzles = { version = "0.1.0", path = "crates/adventuresim-puzzles" }
adventuresim-dialogue = { version = "0.1.0", path = "crates/adventuresim-dialogue" }
adventuresim-strategic-sim = { version = "0.1.0" }
adventuresim-world-schema = { version = "0.1.0", path = "crates/adventuresim-world-schema" }
adventuresim-weapon-model = { version = "0.1.0", path = "crates/adventuresim-weapon-model" }
adventuresim-building-generator = { version = "0.1.0", path = "crates/adventuresim-building-generator" }

fabelgeist-math = { version = "0.1.0", path = "crates/fabelgeist-math" }
fabelgeist-animation = { version = "0.1.0", path = "crates/fabelgeist-animation" }
fabelgeist-determinism = { version = "0.1.0", path = "crates/fabelgeist-determinism" }
fabelgeist-timer = { version = "0.1.0", path = "crates/fabelgeist-timer" }
fabelgeist-fs = { version = "0.1.0", path = "crates/fabelgeist-fs" }
fabelgeist-gpu = { version = "0.1.0", path = "crates/fabelgeist-gpu" }
fabelgeist-fbx = { version = "0.1.0", path = "crates/fabelgeist-fbx" }

bevy = { version = "0.19.0", default-features = false, features = [
  "reflect_auto_register",
  "bevy_log",
  "serialize",
] }
aeronet = { version = "0.21.0" }
aeronet_replicon = { version = "0.21.0", default-features = false }
aeronet_websocket = { version = "0.21.0", default-features = false }
bevy_replicon = { version = "0.41.1", default-features = false, features = [
  "client",
  "server",
] }
avian3d = { version = "0.7.0", default-features = false, features = [
  "3d",
  "f32",
  "parry-f32",
  "parallel",
  "default-collider",
] }
bevy_ahoy = { version = "0.2.0", default-features = false, features = [
  "serialize",
] }
bevy_enhanced_input = { version = "0.26.0", default-features = false, features = [
  "reflect",
] }
bevy_flair = "0.8.0"
bevy_egui = { version = "0.40.1", default-features = false, features = [
  "bevy_ui",
  "default_fonts",
] }
bevy_mod_outline = { version = "0.13", default-features = false, features = [
  "flood",
] }
bevy_eidolon = { version = "0.5" }
bevy_panorbit_camera = { version = "0.35", features = ["bevy_egui"] }
noiz = "0.5.0"
serde = { version = "1", default-features = false, features = [
  "alloc",
  "derive",
] }
serde_json = "1"
serde-saphyr = "1.0.1"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
sha2 = "0.10"
netcdf-reader = { version = "0.8", default-features = false, features = [
  "netcdf4",
] }
console_error_panic_hook = "0.1.7"
async-compat = "0.2.5"
cfg-if = "1.0"
clap = { version = "4.5.60", features = ["derive", "env"] }
tracing = "0.1.44"
rand = "0.9"
rayon = "1.12"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }
thiserror = "2.0.18"
earcut = "0.4.5"
tiff = "0.11.3"
tiny-skia = "0.11.4"
csv = "1.3"
dbase = "0.8.0"
html-escape = "0.2"
image = { version = "0.25.10", default-features = false, features = ["avif"] }
blake3 = "1"
geo = "0.33.1"
geozero = { version = "0.14.0", features = ["with-geo", "with-wkb"] }
proj4rs = { version = "0.1.10", default-features = false }
rusqlite = { version = "0.37.0", features = ["bundled"] }
shapefile = { version = "0.9.0", features = ["geo-types"] }
zip = { version = "3.0.0", default-features = false, features = ["deflate"] }
flate2 = "1.1"
ron = "0.12"
wasm-bindgen = "=0.2.108"
web-time = "1.1.0"
spacetimedb = "=2.6.1"
spacetimedb-sdk = "=2.6.1"
spacetimedb-sats = { version = "=2.6.1", features = ["serde"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[patch.crates-io]
adventuresim-tactical-netcode = { path = "crates/adventuresim-tactical-netcode" }
adventuresim-tactical-core = { path = "crates/adventuresim-tactical-core" }
adventuresim-stdb-client = { path = "crates/adventuresim-stdb-client" }
adventuresim-core = { path = "crates/adventuresim-core" }
adventuresim-puzzles = { path = "crates/adventuresim-puzzles" }
adventuresim-strategic-sim = { path = "crates/adventuresim-strategic-sim" }
# Fork carrying two fixes over 0.5.0: (1) the duplicate CullComputeCamera
# extraction plugin that panics when more than one InstancedMaterialPlugin
# registers, and (2) skipping instanced meshes whose specialized pipeline
# hasn't finished compiling, so the GPU-driven indirect draw doesn't fire
# against a stale pipeline during runtime view-layout switches (atmosphere ->
# environment_map at sky-bake freeze). Consumed from our fork until upstreamed.
bevy_eidolon = { git = "https://github.com/barsoosayque/bevy_eidolon", branch = "fablegeist-0.19" }

[profile.win-dev]
inherits = "dev"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
strip = "debuginfo"
