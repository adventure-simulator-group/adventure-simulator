[workspace]
resolver = "3"
members = [
    "crates/strategic",
    "crates/tactical",
    "crates/character-creator/*",
    "apps/*/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Danilo Guanabara <danilo@sensorial.systems>"]

[workspace.dependencies]
distance-field = { path = "crates/character-creator/distance-field" }
distance-field-plugin = { path = "crates/character-creator/distance-field-plugin" }
marching-cubes = { path = "crates/character-creator/marching-cubes" }
marching-cubes-plugin = { path = "crates/character-creator/marching-cubes-plugin" }
sphere-tracing-plugin = { path = "crates/character-creator/sphere-tracing-plugin" }
character-creator-plugin = { path = "crates/character-creator/character-creator-plugin" }

anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
enum-as-inner = "0.6.1"
indexmap = { version = "2.12.1", features = ["serde"] }
serde_json = "1.0"
web-sys = "0.3"
bytemuck = "1.16"
gpu-runtime = { path = "crates/character-creator/gpu-runtime" }
strum = { version = "0.27.2", features = ["derive"] }
wgpu = { version = "25.0", default-features = false, features = [
    "webgl",
    "webgpu",
    "wgsl",
    "vulkan",
    "dx12",
    "metal",
    "glsl",
] }
wasm-bindgen-futures = "0.4"

bevy = { version = "0.17.3", features = ["serialize"] }
bevy_math = "0.17.3"
bevy_mesh = "0.17.3"
bevy_asset = "0.17.3"
bevy-inspector-egui = { version = "0.35", default-features = false, features = [
    "bevy_pbr",
    "bevy_image",
    "bevy_render",
    "egui_open_url",
] }
bevy_egui = { version = "0.38", default-features = false, features = [
    "open_url",
    "default_fonts",
    "render",
] }

lightyear = { version = "0.25.5", default-features = false }
lightyear_frame_interpolation = { version = "0.25.5", default-features = false }
lightyear_examples_common = { version = "0.25.5", default-features = false }
leafwing-input-manager = { version = "0.19", default-features = false }
avian3d = { version = "0.4", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
console_error_panic_hook = "0.1.7"
async-compat = "0.2.3"
async-trait = "0.1.89"
futures-channel = "0.3"
naga = { version = "25.0", features = ["wgsl-in", "glsl-in", "wgsl-out"] }
regex = "1.10"

cfg-if = "1.0"
clap = { version = "4.5.4", features = ["derive"] }
tracing = "0.1.40"
rand = "0.9"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }
shrinkwraprs = "0.3.0"

async-lock = "3.4.0"
base64 = "0.22.1"
image = "0.25"
percent-encoding = "2.3"
pollster = "0.4"
reqwest = { version = "0.12", features = ["rustls-tls"] }


[workspace.lints.rust]
dead_code = "allow"
unused_variables = "allow"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[patch.crates-io]
lightyear_examples_common = { path = "apps/multiplayer/lightyear_examples_common" }
