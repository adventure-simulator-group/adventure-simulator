<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventure Simulator - WebTransport Test</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; }
        #game_canvas { width: 100vw; height: 100vh; display: block; }
        #status {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: monospace;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
        }
        #status.error { color: #f44; }
        #status.success { color: #4f4; }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <div id="status">Loading WASM...</div>

    <script type="module">
        const status = document.getElementById('status');

        // Get server address and cert digest from URL params or defaults
        const params = new URLSearchParams(window.location.search);
        const serverAddr = params.get('server') || '127.0.0.1:6000';
        const certDigest = params.get('cert') || window.location.hash.slice(1);

        status.textContent = `Connecting to ${serverAddr}...`;

        if (!certDigest || certDigest.length !== 64) {
            status.textContent = 'Error: No certificate digest. Add ?cert=<64-char-hex> or #<digest> to URL';
            status.className = 'error';
            throw new Error('Missing certificate digest');
        }

        // Set hash for WASM client to read
        window.location.hash = certDigest;

        try {
            const module = await import('./wasm/adventure-simulator-client.js');
            await module.default();

            status.textContent = `Connected to ${serverAddr}`;
            status.className = 'success';

            // Start the game with server address
            await module.wasm_run([
                "adventure-simulator-client",
                "--server-addr", serverAddr,
                "--id", "0"
            ]);
        } catch (e) {
            status.textContent = `Error: ${e.message}`;
            status.className = 'error';
            console.error('WASM error:', e);
        }
    </script>
</body>
</html>
