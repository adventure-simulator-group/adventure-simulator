[package]
name = "adventuresim-building-generator"
description = "Standalone procedural building-layout and coarse-geometry prototype"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = []
viewer = [
    "bevy/default",
    "bevy/png",
    "dep:bevy_egui",
    "dep:bevy_mod_outline",
    "dep:bevy_panorbit_camera",
]

[dependencies]
bevy.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
earcut.workspace = true
geo.workspace = true

[target."cfg(not(target_family = \"wasm\"))".dependencies]
bevy_egui = { workspace = true, optional = true }
bevy_mod_outline = { workspace = true, optional = true }
bevy_panorbit_camera = { workspace = true, optional = true }

[lints]
workspace = true

[[bin]]
name = "building-viewer"
path = "src/main.rs"
doc = false
required-features = ["viewer"]

[[bin]]
name = "building-lod-viewer"
path = "src/bin/building-lod-viewer.rs"
doc = false
required-features = ["viewer"]
