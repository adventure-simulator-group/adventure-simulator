[package]
name = "adventuresim-building-generator"
description = "Standalone procedural building-layout and coarse-geometry prototype"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
bevy.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
