<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="blur-stain" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <radialGradient id="stain1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b7355" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#8b7355" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8b7355" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stain2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6b5344" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#6b5344" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#6b5344" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stain3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9b8365" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#9b8365" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#9b8365" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Random coffee-ring style stains -->
  <ellipse cx="60" cy="80" rx="45" ry="35" fill="url(#stain1)" filter="url(#blur-stain)"/>
  <ellipse cx="320" cy="120" rx="55" ry="40" fill="url(#stain2)" filter="url(#blur-stain)"/>
  <ellipse cx="180" cy="300" rx="50" ry="45" fill="url(#stain1)" filter="url(#blur-stain)"/>
  <ellipse cx="350" cy="350" rx="40" ry="50" fill="url(#stain3)" filter="url(#blur-stain)"/>
  <ellipse cx="80" cy="320" rx="35" ry="30" fill="url(#stain2)" filter="url(#blur-stain)"/>
  <ellipse cx="250" cy="60" rx="30" ry="25" fill="url(#stain3)" filter="url(#blur-stain)"/>
  <ellipse cx="150" cy="180" rx="25" ry="30" fill="url(#stain1)" filter="url(#blur-stain)"/>
  <ellipse cx="300" cy="240" rx="35" ry="28" fill="url(#stain2)" filter="url(#blur-stain)"/>

  <!-- Subtle edge darkening -->
  <rect x="0" y="0" width="400" height="400" fill="none" stroke="#8b7355" stroke-width="60" stroke-opacity="0.05" filter="url(#blur-stain)"/>
</svg>
