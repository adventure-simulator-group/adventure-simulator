<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Renaissance Gold Medallion Ornament -->
  <g id="renaissance-gold-medallion">
    <!-- Outer decorative border -->
    <circle cx="100" cy="100" r="95" fill="none" stroke="#EDCE6B" stroke-width="6"/>
    <circle cx="100" cy="100" r="88" fill="none" stroke="#5569AC" stroke-width="3"/>

    <!-- Gold diamond points around edge -->
    <polygon points="100,8 105,20 100,32 95,20" fill="#EDCE6B"/>
    <polygon points="100,168 105,180 100,192 95,180" fill="#EDCE6B"/>
    <polygon points="8,100 20,105 32,100 20,95" fill="#EDCE6B"/>
    <polygon points="168,100 180,105 192,100 180,95" fill="#EDCE6B"/>

    <!-- Diagonal diamond points -->
    <polygon points="35,35 45,28 55,35 45,42" fill="#538237"/>
    <polygon points="165,35 155,28 145,35 155,42" fill="#538237"/>
    <polygon points="35,165 45,172 55,165 45,158" fill="#538237"/>
    <polygon points="165,165 155,172 145,165 155,158" fill="#538237"/>

    <!-- Blue leaf shapes -->
    <path style="fill:#5569AC;" d="M100,25 Q120,50 100,75 Q80,50 100,25 Z"/>
    <path style="fill:#5569AC;" d="M100,175 Q120,150 100,125 Q80,150 100,175 Z"/>
    <path style="fill:#5569AC;" d="M25,100 Q50,120 75,100 Q50,80 25,100 Z"/>
    <path style="fill:#5569AC;" d="M175,100 Q150,120 125,100 Q150,80 175,100 Z"/>

    <!-- Green accent leaves -->
    <path style="fill:#538237;" d="M55,55 Q70,65 75,80 Q60,70 55,55 Z"/>
    <path style="fill:#538237;" d="M145,55 Q130,65 125,80 Q140,70 145,55 Z"/>
    <path style="fill:#538237;" d="M55,145 Q70,135 75,120 Q60,130 55,145 Z"/>
    <path style="fill:#538237;" d="M145,145 Q130,135 125,120 Q140,130 145,145 Z"/>

    <!-- Central medallion -->
    <polygon points="100,55 130,85 130,115 100,145 70,115 70,85" fill="#EDCE6B"/>
    <polygon points="100,62 123,88 123,112 100,138 77,112 77,88" fill="#5569AC"/>
    <polygon points="100,70 115,90 115,110 100,130 85,110 85,90" fill="#538237"/>
    <circle cx="100" cy="100" r="18" fill="#EDCE6B"/>
    <circle cx="100" cy="100" r="10" fill="#57828F"/>
    <circle cx="100" cy="100" r="4" fill="#EDCE6B"/>

    <!-- Teal accent dots -->
    <circle cx="100" cy="48" r="4" fill="#57828F"/>
    <circle cx="100" cy="152" r="4" fill="#57828F"/>
    <circle cx="48" cy="100" r="4" fill="#57828F"/>
    <circle cx="152" cy="100" r="4" fill="#57828F"/>
  </g>
</svg>
