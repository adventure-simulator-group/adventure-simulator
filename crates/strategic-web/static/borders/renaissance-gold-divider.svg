<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 400 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Renaissance Gold Divider Ornament -->
  <g id="renaissance-gold-divider">
    <!-- Center diamond medallion -->
    <polygon points="200,5 225,30 200,55 175,30" fill="#EDCE6B"/>
    <polygon points="200,12 218,30 200,48 182,30" fill="#5569AC"/>
    <polygon points="200,18 212,30 200,42 188,30" fill="#538237"/>
    <circle cx="200" cy="30" r="5" fill="#EDCE6B"/>

    <!-- Left decorative line with elements -->
    <path style="fill:none;stroke:#EDCE6B;stroke-width:4;" d="M170,30 L30,30"/>
    <path style="fill:none;stroke:#5569AC;stroke-width:2;" d="M165,25 L40,25"/>
    <path style="fill:none;stroke:#5569AC;stroke-width:2;" d="M165,35 L40,35"/>

    <!-- Left leaf accents -->
    <path style="fill:#538237;" d="M140,30 Q130,20 120,30 Q130,40 140,30 Z"/>
    <path style="fill:#538237;" d="M100,30 Q90,20 80,30 Q90,40 100,30 Z"/>
    <path style="fill:#57828F;" d="M60,30 Q50,22 40,30 Q50,38 60,30 Z"/>

    <!-- Right decorative line with elements -->
    <path style="fill:none;stroke:#EDCE6B;stroke-width:4;" d="M230,30 L370,30"/>
    <path style="fill:none;stroke:#5569AC;stroke-width:2;" d="M235,25 L360,25"/>
    <path style="fill:none;stroke:#5569AC;stroke-width:2;" d="M235,35 L360,35"/>

    <!-- Right leaf accents -->
    <path style="fill:#538237;" d="M260,30 Q270,20 280,30 Q270,40 260,30 Z"/>
    <path style="fill:#538237;" d="M300,30 Q310,20 320,30 Q310,40 300,30 Z"/>
    <path style="fill:#57828F;" d="M340,30 Q350,22 360,30 Q350,38 340,30 Z"/>

    <!-- End brackets -->
    <rect x="10" y="20" width="15" height="20" fill="#5569AC"/>
    <rect x="13" y="23" width="9" height="14" fill="#EDCE6B"/>
    <rect x="375" y="20" width="15" height="20" fill="#5569AC"/>
    <rect x="378" y="23" width="9" height="14" fill="#EDCE6B"/>

    <!-- Teal accent dots -->
    <circle cx="130" cy="30" r="3" fill="#57828F"/>
    <circle cx="270" cy="30" r="3" fill="#57828F"/>
  </g>
</svg>
