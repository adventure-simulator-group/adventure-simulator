[package]
name = "fabelgeist-gpu"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/adventure-simulator-group/fabelgeist"
license = "GPL-3.0"

[dependencies]
fabelgeist-math = { path = "../fabelgeist-math", features = ["wgpu"] }
fabelgeist-animation = { path = "../fabelgeist-animation" }
fabelgeist-fs = { path = "../fabelgeist-fs" }
fabelgeist-timer = { path = "../fabelgeist-timer" }
anyhow = "1"
async-lock = "3.4.0"
async-trait = "0.1.89"
bytemuck = { version = "1.16", features = ["derive"] }
futures-channel = "0.3"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "bmp",
    "tga",
    "hdr",
] }
indexmap = { version = "2.12.1", features = ["serde"] }
naga = { version = "30.0", features = ["wgsl-in", "glsl-in", "wgsl-out"] }
parking_lot = "0.12"
regex = "1.12.3"
serde = { version = "1", features = ["derive"] }
strum = { version = "0.27.2", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# wgpu is target-specific so the WASM build can turn on
# fragile-send-sync-non-atomic-wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30.0", default-features = false, features = [
    "webgl",
    "webgpu",
    "wgsl",
    "vulkan",
    "metal",
    "glsl",
] }
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0", default-features = false, features = [
    "webgl",
    "webgpu",
    "wgsl",
    "fragile-send-sync-non-atomic-wasm",
] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "console",
    "HtmlTextAreaElement",
    "HtmlDivElement",
    "KeyboardEvent",
    "Event",
    "Element",
    "OffscreenCanvas",
    "CanvasRenderingContext2d",
    "Performance",
    "PerformanceTiming",
] }
