[package]
name = "adventuresim-tactical-client"
description = "Fabelgeist: Wasm game client"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["debug"]
debug = ["bevy/debug", "adventuresim-tactical-core/avian_debug"]
tracy = ["bevy/trace_tracy", "dep:tracing-tracy", "dep:tracing-subscriber", "dep:tracy-client-sys"]
animation-graph-editor = ["dep:bevy_animation_graph_editor"]
animation-graph-physics = ["bevy_animation_graph/physics_avian", "dep:avian3d"]

[dependencies]
bevy.workspace = true
bevy_flair.workspace = true
bevy_egui.workspace = true
bevy_mod_outline.workspace = true
bevy_animation_graph.workspace = true
avian3d = { workspace = true, optional = true }
adventuresim-tactical-core = { workspace = true, features = ["meshgen"] }
adventuresim-tactical-netcode = { workspace = true, features = ["client"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-tracy = { version = "0.11", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
tracy-client-sys = { version = "=0.28.0", optional = true }

[target."cfg(not(target_family = \"wasm\"))".dependencies]
bevy = { workspace = true, default-features = true, features = ["file_watcher"] }
bevy_animation_graph_editor = { workspace = true, optional = true }

[target."cfg(target_family = \"wasm\")".dependencies]
bevy = { workspace = true, default-features = false, features = [
    "default_app",
    "std",
    "bevy_winit",
    "web",
    "webgpu",
    "2d_bevy_render",
    "3d_bevy_render",
    "ui_bevy_render",
    "scene",
    "picking",
    "audio",
    "png",
    "tonemapping_luts",
    "zstd_rust",
] }
console_error_panic_hook.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true

[[bin]]
name = "adventuresim-tactical-client"
doc = false

[[bin]]
name = "animation-viewer"
path = "src/animation_viewer_main.rs"
doc = false
required-features = ["debug"]

[[bin]]
name = "animation-graph-editor"
path = "src/animation_graph_editor_main.rs"
doc = false
required-features = ["animation-graph-editor"]

[[bin]]
name = "ragdoll-viewer"
path = "src/ragdoll_viewer_main.rs"
doc = false
required-features = ["debug", "animation-graph-physics"]

[[bin]]
name = "tactical-scene-viewer"
path = "src/tactical_scene_viewer_main.rs"
doc = false
required-features = ["debug"]
