[package]
name = "adventuresim-tactical-netcode"
description = "Adventure Simulator: Server/Client netcode library"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = []
server = ["lightyear/server"]
client = ["lightyear/client"]

[dependencies]
adventuresim-tactical-core.workspace = true
lightyear = { "workspace" = true, features = [
  "replication",
  "interpolation",
  "netcode",
  "udp",
  "input_bei",
  "avian3d",
] }
bevy_enhanced_input.workspace = true
bevy.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[target."cfg(target_family = \"wasm\")".dependencies]
console_error_panic_hook.workspace = true
rand.workspace = true
getrandom.workspace = true
getrandom_02.workspace = true

[lints]
workspace = true
