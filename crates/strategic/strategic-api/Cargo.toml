[package]
name = "strategic-api"
version.workspace = true
edition.workspace = true

[[bin]]
name = "strategic-api"
path = "src/main.rs"

[dependencies]
axum = "0.7"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync"] }
strategic-db = { path = "../strategic-db" }
strategic-core = { path = "../strategic-core" }
tower-http = { version = "0.5", features = ["cors", "fs"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "json"] }
anyhow = "1"
futures = "0.3"
async-stream = "0.3"
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
