[package]
name = "strategic-db"
version.workspace = true
edition.workspace = true

[dependencies]
strategic-core = { path = "../strategic-core" }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
