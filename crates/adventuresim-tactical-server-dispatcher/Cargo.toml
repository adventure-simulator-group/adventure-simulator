[package]
name = "adventuresim-tactical-server-dispatcher"
version.workspace = true
edition.workspace = true

[[bin]]
name = "adventuresim-tactical-server-dispatcher"
path = "src/main.rs"

[dependencies]
# SpacetimeDB SDK
adventuresim-stdb-client = { path = "../adventuresim-stdb-client" }
rand.workspace = true
sha2.workspace = true

# CLI
clap = { workspace = true, features = ["env"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
