[package]
name = "adventuresim-tactical-server-dispatcher"
version.workspace = true
edition.workspace = true

[[bin]]
name = "adventuresim-tactical-server-dispatcher"
path = "src/main.rs"

[dependencies]
# SpacetimeDB SDK
adventuresim-stdb-client = { path = "../adventuresim-stdb-client" }
adventuresim-core.workspace = true
adventuresim-tactical-core.workspace = true
adventuresim-terrain = { path = "../adventuresim-terrain" }
rand.workspace = true
serde_json.workspace = true
sha2.workspace = true

# CLI
clap = { workspace = true, features = ["env"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
flate2.workspace = true
