<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventure Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }

        #strategic-view {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #ffd700; text-align: center; margin-bottom: 20px; }

        .panel {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .panel h2 { color: #888; font-size: 1rem; margin-bottom: 15px; }

        input, button {
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2a2a4a;
            color: #fff;
            font-size: 1rem;
        }
        button { cursor: pointer; }
        button:hover { background: #3a3a6a; }

        .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .form-row input { flex: 1; }

        .stats { display: flex; gap: 20px; flex-wrap: wrap; }
        .stat { background: rgba(0,0,0,0.2); padding: 15px 20px; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #ffd700; }
        .stat-label { font-size: 0.8rem; color: #888; }

        .locations { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .location {
            background: rgba(255,255,255,0.05);
            border: 2px solid #444;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .location:hover { border-color: #ffd700; transform: translateY(-3px); }

        #status { color: #888; text-align: center; padding: 10px; }
        #status.error { color: #f44; }
        #status.success { color: #4f4; }
    </style>
</head>
<body>
    <div id="strategic-view">
        <h1>Adventure Simulator</h1>

        <div class="panel">
            <h2>Character</h2>
            <div class="form-row">
                <input type="text" id="charName" placeholder="Character name" value="Hero">
                <button onclick="createCharacter()">Create</button>
            </div>
        </div>

        <div class="panel" id="character-panel" style="display:none;">
            <h2>Stats</h2>
            <div class="stats">
                <div class="stat"><div class="stat-value" id="stat-xp">0</div><div class="stat-label">XP</div></div>
                <div class="stat"><div class="stat-value" id="stat-level">1</div><div class="stat-label">Level</div></div>
            </div>
        </div>

        <div class="panel" id="locations-panel" style="display:none;">
            <h2>Select Destination</h2>
            <div class="locations">
                <div class="location" onclick="enterMission('town_a')">
                    <h3>Town A</h3>
                    <p>A peaceful village</p>
                </div>
                <div class="location" onclick="enterMission('town_b')">
                    <h3>Town B</h3>
                    <p>A fortified town</p>
                </div>
            </div>
        </div>

        <div id="status">Ready</div>
    </div>

    <script>
        const API = 'http://' + window.location.hostname + ':3000';
        const MODULE = 'strategic-stdb-module';
        let characterId = null;

        function setStatus(msg, type = '') {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = type;
        }

        async function callReducer(reducer, args) {
            const res = await fetch(`${API}/database/call/${MODULE}/${reducer}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(args)
            });
            if (!res.ok) {
                const text = await res.text();
                throw new Error(text || res.statusText);
            }
            return res.json().catch(() => ({}));
        }

        async function query(sql) {
            const res = await fetch(`${API}/database/sql/${MODULE}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: sql })
            });
            if (!res.ok) throw new Error(res.statusText);
            return res.json();
        }

        async function createCharacter() {
            const name = document.getElementById('charName').value.trim();
            if (!name) return;

            characterId = name.toLowerCase().replace(/\s+/g, '-');
            try {
                await callReducer('create_character', [characterId, name]);
                setStatus('Character created!', 'success');
                document.getElementById('character-panel').style.display = 'block';
                document.getElementById('locations-panel').style.display = 'block';
            } catch (e) {
                setStatus('Error: ' + e.message, 'error');
            }
        }

        async function enterMission(sceneKey) {
            if (!characterId) return;
            try {
                setStatus('Starting mission...', '');
                await callReducer('enter_mission', [characterId, sceneKey]);
                setStatus('Mission started! Server spawning...', 'success');
                pollForServer();
            } catch (e) {
                setStatus('Error: ' + e.message, 'error');
            }
        }

        async function pollForServer() {
            for (let i = 0; i < 30; i++) {
                await new Promise(r => setTimeout(r, 1000));
                try {
                    const result = await query(`SELECT * FROM tactical_server WHERE character_id = '${characterId}'`);
                    if (result.rows && result.rows.length > 0) {
                        const server = result.rows[0];
                        if (server.status && server.status.tag === 'Ready') {
                            setStatus(`Server ready at ${server.host}:${server.port}`, 'success');
                            return;
                        }
                    }
                } catch (e) {
                    console.log('Poll error:', e);
                }
            }
            setStatus('Server spawn timeout', 'error');
        }
    </script>
</body>
</html>
