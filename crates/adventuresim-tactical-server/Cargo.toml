[package]
name = "adventuresim-tactical-server"
version.workspace = true
edition.workspace = true

[lib]
name = "adventuresim_tactical_server"
path = "src/lib.rs"

[[bin]]
name = "adventuresim-tactical-server"
path = "src/main.rs"

[[bin]]
name = "melee-combat-iteration"
path = "src/bin/melee-combat-iteration.rs"
required-features = ["iteration"]

[features]
default = []
debug = ["bevy/debug", "bevy/bevy_remote", "bevy/scene", "dep:ron"]
# See src/lib.rs - only used by crates/adventuresim-tactical-brp-generator.
remote-types = ["debug"]
iteration = []

[dependencies]
rand.workspace = true
fabelgeist-determinism.workspace = true
serde-saphyr.workspace = true
serde.workspace = true
serde_json.workspace = true

# Bevy + shared Aeronet/Replicon netcode
bevy = { workspace = true, features = ["multi_threaded"] }
adventuresim-tactical-netcode = { workspace = true, features = ["server"] }
adventuresim-tactical-core.workspace = true
adventuresim-core.workspace = true
adventuresim-world-schema.workspace = true

# SpacetimeDB client
adventuresim-stdb-client.workspace = true 
spacetimedb-sdk.workspace = true

# CLI
clap = { workspace = true }

# Debug-only world dump loading
ron = { workspace = true, optional = true }

[lints]
workspace = true
