[package]
name = "adventuresim-stdb-module"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
adventuresim-core.workspace = true
adventuresim-dialogue.workspace = true
adventuresim-world-schema = { workspace = true, features = ["spacetimedb"] }
adventuresim-weapon-model.workspace = true
log = "0.4"
spacetimedb.workspace = true
petname = { version = "2.0.2", default-features = false, features = ["default-words"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strum = { version = "0.28", features = ["derive"] }

[lints]
workspace = true
