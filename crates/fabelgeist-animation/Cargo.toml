[package]
name = "fabelgeist-animation"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/adventure-simulator-group/fabelgeist"
license = "GPL-3.0"

[dependencies]
fabelgeist-math = { path = "../fabelgeist-math" }
anyhow = "1"
indexmap = { version = "2.12.1", features = ["serde"] }
