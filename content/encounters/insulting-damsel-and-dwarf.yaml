      "opening": [
        {
          "speaker": "sharp_tongued_damsel",
          "text": "I bear Saint Michael's candles under vow unto the chapel beyond this washed hollow, and that holy errand licenseth me to demand the private shortcut. I shall not humble my rank upon the longer public lower path merely because my steward counseleth caution. You look better dressed for status than proved in judgment or courage. Twenty groschen await one who returneth with sound proof, and twelve more shall reward one who can marshal this household without confusion.",
          "reviewed_shakespearean": true
        },
        {
          "speaker": "dwarf_steward",
          "text": "Fresh signs mark the soft turf beside this bank, my lady, and weathered private toll cuts remain upon yon stone, though no present toll is declared. The known public lower path remaineth open. Hear my terrain judgment before any servant is sent upon the private shelf.",
          "reviewed_shakespearean": true
        }
      ],
