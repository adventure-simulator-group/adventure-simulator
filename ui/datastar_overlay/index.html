<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adventure Simulator · Datastar Overlay (SSE)</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="overlay" data-signals="{character: 'demo'}"
       data-init="@get('/characters/' + $character + '/state'); @get('/characters/' + $character + '/events')">
    <header class="overlay-header">
      <div class="overlay-title">Strategic Overlay</div>
      <div class="overlay-subtitle">Live view via SSE (<code>datastar-patch-elements</code>)</div>
      <div class="overlay-controls">
        <label>Character <input type="text" data-bind:character value="demo" /></label>
        <button data-on:click="@get('/characters/' + $character + '/state'); @get('/characters/' + $character + '/events')">Connect</button>
      </div>
    </header>
    <div id="overlay-root">
      <div id="overlay-banner" class="banner">Waiting for updates…</div>
      <div class="panel">No data yet.</div>
    </div>
  </div>

  <!-- Local vendored Datastar module -->
  <script type="module" src="./datastar.es.js"></script>
</body>
</html>
